<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
    
    <title>Sortable Test</title>
    
    <style>
    .card {
      width:120px;height:120px;background:#EEE;
    }
    .slider { display:flex; }
    
    </style>

  </head>
  <body>
<div id="example1" class="slider list-group row">
	<div class="card list-group-item">Item 1</div>				
	<div class="card list-group-item">Item 2</div>
	<div class="card list-group-item">Item 3</div>
	<div class="card list-group-item">Item 4</div>
	<div class="card list-group-item">Item 5</div>
	<div class="card list-group-item">Item 6</div>
</div>

<script>
new Sortable(example1, {
    animation: 150,
    ghostClass: 'blue-background-class'
});
</script>
  </body>
</html>
