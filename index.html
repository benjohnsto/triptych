      toggleCrop() {
	      
	    this.isCropActive = !this.isCropActive;

	    const btn = this.ui.cropButton;

	    if (this.isCropActive) {
		// Set images for Active state

                //this.viewer.removeOverlay("overlay");
	    } else {
		// Revert to Inactive state
		btn.imgRest.src = 'assets/images/crop.svg';
		btn.imgHover.src = 'assets/images/crop.svg';
                this.viewer.setMouseNavEnabled(true);
                //this.viewer.removeOverlay("overlay");
	    }

	    // Force OpenSeadragon to update the DOM visibility based on current mouse state
	    if (btn.isHovered) {
		btn.imgRest.style.visibility = 'hidden';
		btn.imgHover.style.visibility = 'visible';
	    } else {
		btn.imgRest.style.visibility = 'visible';
		btn.imgHover.style.visibility = 'hidden';
	    }

	/************************************
	* Load a manifest
	* to do: if a manifest uses static images, we cannot use this tool
	* we need to alert the user
	* an example manifest with static jpgs at https://discover.york.ac.uk/ark:/36941/13192/presentation/3/manifest 
	*************************************/
	async load(url) {
	
	    url = this.normalizeUrl(url);
	
            if (this.isLoaded(url)) { return false; }
            
            if (this.isSingleImage(url)) {
               parseSingleImage(url);
               return;
            }
	    
	    
	    try {
		const response = await fetch(url);
		const data = await response.json();
		const manifest = manifesto.parseManifest(data);

		switch(manifest.getIIIFResourceType()) {
			 case "collection":
			     this.collection = url;
			     for(var i in manifest.items) {
			        this.load(manifest.items[i].id);
			     }

			 break;
			 case "manifest":
			     //this.manifests.unshift(manifest);
			     this.manifests[manifest.id] = manifest;
			 break;	         
		}
		
		this.drawGallery();
	    } catch (error) {
		console.error('Failed to load manifest:', error);
	    }

	}
	
	
	
	/**
	 * Normalizes vendor-specific URL patterns (such as UCLA ARK identifiers)
	 */
	normalizeUrl(url) {
	    if (!url) return '';
	    // Combines full image and manifest ARK replacements into a single regex
	    return url.replace(/ark:\/(.*?)\/(full|manifest)/g, (match, arkPath, suffix) => {
		const encodedPath = arkPath.split('/').map(encodeURIComponent).join('%2F');
		return `ark%3A%2F${encodedPath}/${suffix}`;
	    });
	}

	/**
	 * Helper to identify IIIF single image URLs
	 */
	isSingleImage(url) {
	    return /\/([0-9]{1,3})\/(color|gray|bitonal|default)\.(png|jpg)/.test(url);
	}

	/**
	 * Checks if a manifest with the given ID/URL is already loaded
	 */
        isLoaded(url) {
          return Object.hasOwn(this.manifests, url);
          //return this.manifests.some(m => m.id === url);
        }
       
       /*************************
        * get the url vars
        ***********************************/
       getURLValues() {
           var search = window.location.search.replace(/^\?/, '').replace(/\+/g, ' ');
           var values = {};
           if (search.length) {
               var part, parts = search.split('&');
               for (var i = 0, iLen = parts.length; i < iLen; i++) {
                   part = parts[i].split('=');
                   values[part[0]] = window.decodeURIComponent(part[1]);
               }
           }
           return values;
       }

    makeid() {
	    let result = '';
	    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
	    const charactersLength = characters.length;
	    let counter = 0;
	    while (counter < 24) {
	        result += characters.charAt(Math.floor(Math.random() * charactersLength));
	        counter += 1;
	    }
	    return result;
    }

       getPrevNext(targetKey, object) {
         const keys = Object.keys(object);
         const index = keys.indexOf(targetKey);

         if (index === -1) return null; // Key not found
         
         var prev = keys[index - 1] ? object[keys[index - 1]].canvas : null;
         var next = keys[index + 1] ? object[keys[index + 1]].canvas : null;
         
         this.ui.next.setAttribute("rel", next);
         this.ui.prev.setAttribute("rel", prev);

	    /*************************
	    * handle mouse actions on viewer canvas
	    *************************/
	    handlePress(event) {

		//if (this.isCropActive) {  return;  }
		//this.viewer.removeOverlay("overlay");
		var overlayElement = document.createElement("div");
		overlayElement.id = "overlay";
		overlayElement.className = "highlight";

		var viewportPos = this.viewer.viewport.pointFromPixel(event.position);
		this.viewer.addOverlay({
		    element: overlayElement,
		    location: new OpenSeadragon.Rect(viewportPos.x, viewportPos.y, 0, 0)
		});
		//this.overlayOn = true;
		    
		this.viewer.drag = {
		    overlayElement: overlayElement,
		    startPos: viewportPos
		};
	    }
       
	    handleDrag(event) {
		    if (typeof this.viewer.drag === 'undefined') { return; }
		    var viewportPos = this.viewer.viewport.pointFromPixel(event.position);

		    var diffX = viewportPos.x - this.viewer.drag.startPos.x;
		    var diffY = viewportPos.y - this.viewer.drag.startPos.y;

		    var location = new OpenSeadragon.Rect(
		        Math.min(this.viewer.drag.startPos.x, this.viewer.drag.startPos.x + diffX),
		        Math.min(this.viewer.drag.startPos.y, this.viewer.drag.startPos.y + diffY),
		        Math.abs(diffX),
		        Math.abs(diffY)
		    );
		   
		    
		    var tiledImage = this.viewer.world.getItemAt(0);
		    var tileSource = tiledImage.source;

		    

		    var w = tileSource.width;
		    var h = tileSource.height;
		    
		    

		    var region = [
		        Math.floor(location.x * w),
		        Math.floor(location.y * w),
		        Math.floor(location.width * w),
		        Math.floor(location.height * w)
		    ]


		    // if the box goes outside the boundaries of the image

		        if (region[0] < 0) { region[0] = 0;  }
		        if (region[1] < 0) { region[1] = 0;  }
		        if (region[0]+region[2] > w) { region[2] = w - region[0]; }
		        if (region[1]+region[3] > h) { region[3] = h - region[1]; }


		    // update the box    
		    this.viewer.updateOverlay(this.viewer.drag.overlayElement, location);
		    //this.ui.annoregion.value = region;
		    this.region = region;
		    //this.ui.annoregion.value = region.join(',');
	    }
	    
	    
	    handleRelease(event) {
	            var slide = structuredClone(this.current);
	            slide.id = this.makeid();
	            slide.region = this.region;
	            slide.thumbnail = `${this.current.service}/${this.region}/330,/0/default.jpg`
	            slide.caption = "This is the cooption";
	            slide.tags = [];
	            slide.text = "";
	            this.slides.push(slide);
	            //this.items[this.current.canvas].annotations.push(slide);
	            this.drawSlides();
	            this.toggleCrop();
	            this.openStrip();
	    }
	    
	    
	    domElement(element, id, attr, appendTo, innerText = null) {
              var r = document.createElement(element);
              r.id = id;
              for(var i in attr) {
                if(i == "class") { r.classList.add(attr[i]); }
                else { r[i] = attr[i]; }
              }
              if(innerText) { r.innerText = innerText; }
              appendTo.appendChild(r);
              return r;
	    }

           
    }
