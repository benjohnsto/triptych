    <script>
    

    
    
    class MyApp {

        this.ui.left =   this.domElement('div',"left", {}, container);
        this.ui.leftContent = this.domElement('div',"leftContent", {}, this.ui.left);
        this.ui.leftHandle = this.domElement('div',"leftHandle", {}, this.ui.left);
        this.ui.right = this.domElement('div',"right", {}, container);
        this.ui.rightHandle = this.domElement('div',"rightHandle", {}, this.ui.right); 
        this.ui.rightContent = this.domElement('div',"rightContent", {}, this.ui.right);

        this.ui.modal = this.domElement('div',"modal", {}, container);
        /*
        var modal = document.createElement("div");
        modal.id = "modal";
        this.ui.modal = modal;

        container.appendChild(modal);
 
        var toolbar = document.createElement("div");
        toolbar.id = "modal_toolbar";
        toolbar.style.display = "flex";
        toolbar.style['justify-content'] = "right";
        toolbar.style.padding = "4px";
        toolbar.style.cursor = "pointer";
        this.ui.modal.appendChild(toolbar);
        
        this.ui.close = document.createElement("img");
        this.ui.close.src = "assets/images/close.svg";
        this.ui.close.addEventListener("click", (e) => this.closeModal());
        toolbar.appendChild(this.ui.close);
*/       

        var annoform          = this.domElement('div',"myannoform", {}, rightContent);
        this.ui.annoregion    = this.domElement('input',"annoregion", {"type":"text"}, annoform);
        this.ui.annopreview   = this.domElement('div', "annopreview",{}, annoform);
        this.ui.annotext      = this.domElement('textarea',"annotext", {}, annoform);
        var annobuttons       = this.domElement('div',"annobuttons",{}, annoform);
        annobuttons.style.display = "flex";
        annobuttons.style['justify-content'] = "right";
        this.ui.annocancel    = this.domElement('input',"cancel",{"type":"button","value":"Cancel"}, annobuttons);
        this.ui.annosubmit    = this.domElement('input',"submit",{"type":"submit","value":"Create"}, annobuttons);

 
        //top.appendChild(right);
        
        var b1    = this.domElement('button',"b1",{"value":"OpenLeft"}, this.ui.bottom);
        
        
        // temporary
        var button1 = document.createElement("button");
        button1.innerText = "Show/Hide Right";
        button1.addEventListener("click", (e) => this.openRight());
        bottom.appendChild(button1);
        //this.ui['button5'] = button5;
        
        var button2 = document.createElement("button");
        button2.innerText = "Show/Hide Left";
        button2.addEventListener("click", (e) => this.openLeft());
        bottom.appendChild(button2);
        //this.ui['button5'] = button5;
        
        var button5 = document.createElement("button");
        button5.classList.add("dov1");
        button5.innerText = "Show/Hide Strip";
        button5.addEventListener("click", (e) => this.toggleStrip());
        bottom.appendChild(button5);
        //this.ui['button5'] = button5;
        
        var button6 = document.createElement("button");
        button6.classList.add("dov1");
        button6.innerText = "Open Modal";
        button6.addEventListener("click", (e) => this.openModal());
        bottom.appendChild(button6);
        //this.ui['button5'] = button5;
        
        var button7 = document.createElement("button");
        button7.classList.add("dov1");
        button7.innerText = "Close Modal";
        button7.addEventListener("click", (e) => this.closeModal());
        bottom.appendChild(button7);
        //this.ui['button5'] = button5;
        
        var form = document.createElement("div");
        left.appendChild(form); 
        
        var defaultManifest = "https://data.artmuseum.princeton.edu/iiif/objects/2687";
        
        var addmanifest = this.domElement('div',"addmanifest",{}, this.ui.leftContent);
        
        this.ui.manifest = this.domElement('input',"manifest",{"type":"text","value": defaultManifest}, addmanifest);
        this.ui.go = this.domElement('button',"manifestsubmit",{"type":"submit"}, addmanifest, "Go");
        this.ui.go.onclick = () => { 
          var manifest = this.ui.manifest.value;
          this.load(manifest);
         }
        //≡
        this.ui.toggleButtonLeft = this.domElement('button',"tbl",{"href":"#"}, this.ui.leftHandle, "|");
        this.ui.toggleButtonLeft.onclick = () => { this.toggleLeft(); }
        this.ui.toggleButtonRight = this.domElement('button',"tbr",{"href":"#"}, this.ui.rightHandle, "|");
        this.ui.toggleButtonRight.onclick = () => { this.toggleRight(); }
        /*
        this.ui.manifest = document.createElement("input");
        this.ui.manifest.type = "text";
        this.ui.manifest.value = "https://data.artmuseum.princeton.edu/iiif/objects/2687";
        this.ui.button = document.createElement("input");
        this.ui.button.type = "submit";
        this.ui.button.value = "Go";
        this.ui.button.onclick = () => { this.load(this.ui.manifest.value); }
        form.appendChild(this.ui.manifest);
        form.appendChild(this.ui.button);
*/

      openLeft() { this.ui.left.classList.add('shown'); }
      closeLeft() { this.ui.left.classList.remove('shown'); }
      toggleLeft() {
        if(this.ui.left.classList.contains('shown')) { this.closeLeft(); }
        else { this.openLeft(); }
      }
      
      openRight() { this.ui.right.classList.add('shown'); }
      closeRight() { this.ui.right.classList.remove('shown'); }
      toggleRight() {
        if(this.ui.right.classList.contains('shown')) { this.closeRight(); }
        else { this.openRight(); }
      }
      
      openStrip() {
        this.ui.bottom.className = "shown";
      }
      
      closeStrip() {
        this.ui.bottom.className = "";
      }
      
      toggleStrip() {
        if(this.ui.bottom.classList.contains('shown')) {
          this.closeStrip();
        }
        else {
          this.openStrip();
        }
      }
      
      init() {
      
      
        /**************************
        * if there is a manifest url var, load it
        *************************************************/
	var vars = this.getURLValues();
	if (typeof vars.manifest !== 'undefined') {
	   var url = vars.manifest;
	   this.ui.manifest.value = url;
	   this.load(url);
	}
      
      console.log(this.ui);
      
	this.viewer = OpenSeadragon({
	  id: this.ui.viewerContainer.id,
	  prefixUrl: "assets/js/openseadragon/images/",
	  tileSources: [],
	  showFullPageControl: false,
	  showRotationControl: true,
	  minZoomLevel: 0.1
	});
	
        this.viewer.tracker = new OpenSeadragon.MouseTracker({
            element: this.viewer.element,
            pressHandler: (event) => {  this.handlePress(event);  },
            dragHandler: (event) => {  this.handleDrag(event);  },
            releaseHandler: (event) => {  this.handleRelease(event);  }
        });
	
	/*************************************
	* 
	*************************************/
        this.ui.cropButton = new OpenSeadragon.Button({
                tooltip: '',
                srcRest: 'assets/images/crop.svg',
                srcHover: 'assets/images/crop.svg',
                onClick: () => this.toggleCrop()
        });
        this.ui.cropButton.element.id = 'cropbutton';
        this.viewer.addControl(this.ui.cropButton.element, {
            anchor: OpenSeadragon.ControlAnchor.TOP_LEFT
        });
 
        
      } // end init
      
      /*************************************
      * 
      *************************************/
      
      setCurrent(index) {
        //console.log(this.items);
      }
      
      
      /*************************************
      * 
      *************************************/
      toggleCrop() {
	      
	    this.isCropActive = !this.isCropActive;

	    const btn = this.ui.cropButton;

	    if (this.isCropActive) {
		// Set images for Active state
		btn.imgRest.src = 'assets/images/crop-active.svg';
		btn.imgHover.src = 'assets/images/crop-active-hover.svg'; // Or same image if no hover variant
                this.viewer.setMouseNavEnabled(false);
                this.viewer.removeOverlay("overlay");
	    } else {
		// Revert to Inactive state
		btn.imgRest.src = 'assets/images/crop.svg';
		btn.imgHover.src = 'assets/images/crop.svg';
                this.viewer.setMouseNavEnabled(true);
                this.viewer.removeOverlay("overlay");
	    }

	    // Force OpenSeadragon to update the DOM visibility based on current mouse state
	    if (btn.isHovered) {
		btn.imgRest.style.visibility = 'hidden';
		btn.imgHover.style.visibility = 'visible';
	    } else {
		btn.imgRest.style.visibility = 'visible';
		btn.imgHover.style.visibility = 'hidden';
	    }        
      }
      
	/************************************
	* Load a manifest
	* to do: if a manifest uses static images, we cannot use this tool
	* we need to alert the user
	* an example manifest with static jpgs at https://discover.york.ac.uk/ark:/36941/13192/presentation/3/manifest 
	*************************************/
	load(url) {

	    // UCLA has an 'ark:' in their urls that need to be encoded
	    url = url.replace(/ark:\/(.*?)\/full/, function(r, a) {
	        var parts = a.split('/');
	        return "ark%3A%2F" + parts.join('%2F')+"/full";
	    });
	    url = url.replace(/ark:\/(.*?)\/manifest/, function(r, a) {
	        var parts = a.split('/');
	        return "ark%3A%2F" + parts.join('%2F')+"/manifest";
	    });

	    // if this is an Internet Archive URL
	    // convert it to a manifest
	    if (url.indexOf("archive.org") > 0 && url.indexOf("details") > 0) {
	        url = internetArchive2Manifest(url);
	    }


	    // if this is a IIIF image url, parse it
	    if (url.search(/\/([0-9]{1,3})\/(color|gray|bitonal|default)\.(png|jpg)/) > 0) {
		    parseSingleImage(url);
	    } else {
	    
	              
            fetch(url).then(response => response.json())
            .then(data => {
            
                const manifest = manifesto.parseManifest(data);
                
		switch(manifest.getIIIFResourceType()) {
			 case "collection":
			     this.collection = url;
			     //console.log("collection ",manifest.items.length + " items");
			     for(var i in manifest.items) {
			        this.load(manifest.items[i].id);
			     }

			 break;
			 case "manifest":
			     this.manifests.unshift(manifest);
			 break;	         
		}
		
		
		
            }).then( () => { 
                this.drawGallery();
            }).catch(error => {
	         console.error('Failed to load manifest:', error);
	    });



	    } // end else

	}
	

       
       /*************************
        * get the url vars
        ***********************************/
       getURLValues() {
           var search = window.location.search.replace(/^\?/, '').replace(/\+/g, ' ');
           var values = {};
           if (search.length) {
               var part, parts = search.split('&');
               for (var i = 0, iLen = parts.length; i < iLen; i++) {
                   part = parts[i].split('=');
                   values[part[0]] = window.decodeURIComponent(part[1]);
               }
           }
           return values;
       }


       drawGallery() {
       

       
         this.ui.gallery.innerHTML = "";
       
         for(var i in this.manifests) {
           var m = this.manifests[i]
           var label = m.getLabel().getValue();
           var items = m.getSequences()[0].getCanvases();
           
           var item = document.createElement("div");
           this.ui.gallery.appendChild(item);
           
           // BEN

           var head = document.createElement("h2");
           head.innerText = label
           item.appendChild(head); 
           var cardgrp = document.createElement("div");
           cardgrp.classList.add('cardgrp');
           item.appendChild(cardgrp);

           for(var k in items) {
              var o = {
                 "canvas":  items[k].id,
                 "service": items[k].imageResources[0].getServices()[0].id,
                 "profile": items[k].imageResources[0].getServices()[0].getProfile(),
                 "thumbnail": items[k].getCanonicalImageUri(200),
                 "label": items[k].getLabel().getValue()
	      }
	      this.items[o.canvas] = o;
	      
              var card = document.createElement("a");
              card.classList.add('card');
              card.setAttribute("rel", o.canvas); 
              card.setAttribute("href","#");
              cardgrp.appendChild(card); 
              card.addEventListener("click", (e) => {
                 var canvas = e.currentTarget.getAttribute('rel');
                 this.selectGalleryItem(canvas);
              });
              
              var img = document.createElement("img");
              img.title = items[k].getLabel().getValue();
              img.setAttribute('src',items[k].getCanonicalImageUri(200)); 
              card.appendChild(img);
              
              if(!this.loaded) { this.loaded = true; this.selectGalleryItem(o.canvas); }
	      
           }

           
         }
       }


       selectGalleryItem(canvas) {
         this.current = this.items[canvas];
         this.viewer.removeOverlay("overlay");
         this.isCropActive = false;
         this.closeLeft();
         this.viewer.open(this.current.service);
         this.showCropButton();
       }
       


       openModal(o) {
         console.log('open modal');
         this.ui.modal.style.display = "block";
       }  
       closeModal(o) {
         console.log('close modal');
         this.ui.modal.style.display = "none";
       }
       
       showCropButton() {
         this.ui.cropButton.element.style.display = "inline-block";
       }
       hideCropButton() {
         this.ui.cropButton.element.style.display = "none";
       }
       
       /***********************
       * Add a tile to the slider strip
       ******************************/
       addTile() {
         var thumbnail = `${this.current.service}/${this.current.region}/330,/0/default.jpg`;
         var canvas = this.current.canvas;
         var card = this.makeCard("hgfyehr64hr", canvas, thumbnail, "My Caption");
         this.ui.slider.prepend(card);
         card.addEventListener("click", (e) => {
            var canvas = e.currentTarget.getAttribute('rel');
            this.selectSliderItem(canvas);
         });      
         this.openStrip();
       }
       
       
       makeCard(id, canvas, thumbnail, caption) {
         var card = document.createElement("a");
         card.classList.add('card');
         card.setAttribute("rel", canvas); 
         card.setAttribute("href","#");    
         var img = document.createElement("img");
         img.title = "My Caption";
         img.setAttribute('src', thumbnail);
         var cap = document.createElement("p");
         cap.innerText = "My Caption";
         card.appendChild(img);
         card.appendChild(cap);
         return card;
         
       }
       
       selectSliderItem(canvas) {
         this.viewer.open("");
         var d = this.items[canvas];
         this.viewer.removeOverlay("overlay");
         var tilesource = {
            type: 'image',
            url:  `${d.service}/${d.region}/1200,/0/default.jpg`
         }
         this.isCropActive = false;
         this.viewer.open(tilesource);
         this.closeStrip();
         this.hideCropButton();
       }
       
       
       
	    /*************************
	    * handle mouse actions on viewer canvas
	    *************************/
	    handlePress(event) {

		//if (this.isCropActive) {  return;  }
		this.viewer.removeOverlay("overlay");
		var overlayElement = document.createElement("div");
		overlayElement.id = "overlay";
		overlayElement.className = "highlight";

		var viewportPos = this.viewer.viewport.pointFromPixel(event.position);
		this.viewer.addOverlay({
		    element: overlayElement,
		    location: new OpenSeadragon.Rect(viewportPos.x, viewportPos.y, 0, 0)
		});
		//this.overlayOn = true;
		    
		this.viewer.drag = {
		    overlayElement: overlayElement,
		    startPos: viewportPos
		};
	    }
       
	    handleDrag(event) {
		    if (typeof this.viewer.drag === 'undefined') { return; }
		    var viewportPos = this.viewer.viewport.pointFromPixel(event.position);

		    var diffX = viewportPos.x - this.viewer.drag.startPos.x;
		    var diffY = viewportPos.y - this.viewer.drag.startPos.y;

		    var location = new OpenSeadragon.Rect(
		        Math.min(this.viewer.drag.startPos.x, this.viewer.drag.startPos.x + diffX),
		        Math.min(this.viewer.drag.startPos.y, this.viewer.drag.startPos.y + diffY),
		        Math.abs(diffX),
		        Math.abs(diffY)
		    );
		   
		    
		    var tiledImage = this.viewer.world.getItemAt(0);
		    var tileSource = tiledImage.source;

		    

		    var w = tileSource.width;
		    var h = tileSource.height;
		    
		    

		    var region = [
		        Math.floor(location.x * w),
		        Math.floor(location.y * w),
		        Math.floor(location.width * w),
		        Math.floor(location.height * w)
		    ]


		    // if the box goes outside the boundaries of the image

		        if (region[0] < 0) { region[0] = 0;  }
		        if (region[1] < 0) { region[1] = 0;  }
		        if (region[0]+region[2] > w) { region[2] = w - region[0]; }
		        if (region[1]+region[3] > h) { region[3] = h - region[1]; }


		    // update the box    
		    this.viewer.updateOverlay(this.viewer.drag.overlayElement, location);
		    this.ui.annoregion.value = region;
		    this.current.region = region;
	    }
	    
	    
	    handleRelease(event) {
	            //var preview = `${this.current.service}/${this.current.region}/300,/0/default.jpg`;
	            //var myimg = this.domElement("img","pr",{"src": preview}, this.ui.annopreview);

	            //this.ui.annopreview.setAttribute("src",preview);
	            
	            this.addTile();
	            this.toggleCrop();
	            //this.openRight();
	            this.this.toggleStrip();
		    
	    }
	    
	    
	    domElement(element, id, attr, appendTo, innerText = null) {
              var r = document.createElement(element);
              r.id = id;
              for(var i in attr) {
                r[i] = attr[i];
              }
              if(innerText) { r.innerText = innerText; }
              appendTo.appendChild(r);
              return r;
	    }

           
    }
    
    
    var a = new MyApp('myapp');
