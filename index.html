          z-index:999;
          transition: bottom 1s;
        }

	/************************************

	* to do: if a manifest uses static images, we cannot use this tool
	* we need to alert the user
	* an example manifest with static jpgs at https://discover.york.ac.uk/ark:/36941/13192/presentation/3/manifest 
	*************************************/
	load(url) {

	    // UCLA has an 'ark:' in their urls that need to be encoded
	    url = url.replace(/ark:\/(.*?)\/full/, function(r, a) {
	        var parts = a.split('/');
	        return "ark%3A%2F" + parts.join('%2F')+"/full";
	    });
	    url = url.replace(/ark:\/(.*?)\/manifest/, function(r, a) {
	        var parts = a.split('/');
	        return "ark%3A%2F" + parts.join('%2F')+"/manifest";
	    });

	    // if this is an Internet Archive URL
	    // convert it to a manifest
	    if (url.indexOf("archive.org") > 0 && url.indexOf("details") > 0) {
	        url = internetArchive2Manifest(url);
	    }


	    // if this is a IIIF image url, parse it
	    if (url.search(/\/([0-9]{1,3})\/(color|gray|bitonal|default)\.(png|jpg)/) > 0) {
		    parseSingleImage(url);
	    } else {
	    
	    
            fetch(url).then(response => response.json())
            .then(data => {
            
                const manifest = manifesto.parseManifest(data);
                
		switch(manifest.getIIIFResourceType()) {
			 case "collection":
			     this.collection = url;
			     //console.log("collection ",manifest.items.length + " items");
			     for(var i in manifest.items) {
			        this.load(manifest.items[i].id);
			     }

			 break;
			 case "manifest":
			     this.manifests[url] = manifest;
			     //this.addToGallery(manifest);
			 break;	         
		}
		
		
		
            }).then( () => { 
                this.drawGallery();
            }).catch(error => {
	         console.error('Failed to load manifest:', error);
	    });



	    } // end else

	}

       /*************************
        * get the url vars
        ***********************************/
       getURLValues() {
           var search = window.location.search.replace(/^\?/, '').replace(/\+/g, ' ');
           var values = {};
           if (search.length) {
               var part, parts = search.split('&');
               for (var i = 0, iLen = parts.length; i < iLen; i++) {
                   part = parts[i].split('=');
                   values[part[0]] = window.decodeURIComponent(part[1]);
               }
           }
           return values;
       }

	    /*************************
	    * handle mouse actions on viewer canvas
	    *************************/
	    handlePress(event) {

		//if (this.isCropActive) {  return;  }
		this.viewer.removeOverlay("overlay");
		var overlayElement = document.createElement("div");
		overlayElement.id = "overlay";
		overlayElement.className = "highlight";

		var viewportPos = this.viewer.viewport.pointFromPixel(event.position);
		this.viewer.addOverlay({
		    element: overlayElement,
		    location: new OpenSeadragon.Rect(viewportPos.x, viewportPos.y, 0, 0)
		});
		//this.overlayOn = true;
		    
		this.viewer.drag = {
		    overlayElement: overlayElement,
		    startPos: viewportPos
		};
	    }
       
	    handleDrag(event) {
		    if (typeof this.viewer.drag === 'undefined') { return; }
		    var viewportPos = this.viewer.viewport.pointFromPixel(event.position);

		    var diffX = viewportPos.x - this.viewer.drag.startPos.x;
		    var diffY = viewportPos.y - this.viewer.drag.startPos.y;

		    var location = new OpenSeadragon.Rect(
		        Math.min(this.viewer.drag.startPos.x, this.viewer.drag.startPos.x + diffX),
		        Math.min(this.viewer.drag.startPos.y, this.viewer.drag.startPos.y + diffY),
		        Math.abs(diffX),
		        Math.abs(diffY)
		    );
		   
		    
		    var tiledImage = this.viewer.world.getItemAt(0);
		    var tileSource = tiledImage.source;

		    

		    var w = tileSource.width;
		    var h = tileSource.height;
		    
		    

		    var region = [
		        Math.floor(location.x * w),
		        Math.floor(location.y * w),
		        Math.floor(location.width * w),
		        Math.floor(location.height * w)
		    ]


		    // if the box goes outside the boundaries of the image

		        if (region[0] < 0) { region[0] = 0;  }
		        if (region[1] < 0) { region[1] = 0;  }
		        if (region[0]+region[2] > w) { region[2] = w - region[0]; }
		        if (region[1]+region[3] > h) { region[3] = h - region[1]; }


		    // update the box    
		    this.viewer.updateOverlay(this.viewer.drag.overlayElement, location);
		    this.ui.annoregion.value = region;
		    this.current.region = region;
	    }
	    
	    
	    handleRelease(event) {
	            if(this.getLayout() == 'v') { this.setLayout(null,'v2'); }
	            else { this.setLayout(null,'v3'); }
	            var preview = `${this.current.service}/${this.current.region}/300,/0/default.jpg`;
	            var myimg = this.domElement("img","pr",{"src": preview}, this.ui.annopreview);

	            //this.ui.annopreview.setAttribute("src",preview);
		    
	    }
	    
	    
	    domElement(element, id, attr, appendTo, innerText = null) {
              var r = document.createElement(element);
              r.id = id;
              for(var i in attr) {
                r[i] = attr[i];
              }
              if(innerText) { r.innerText = innerText; }
              appendTo.appendChild(r);
              return r;
	    }

           
    }
